version: '3.9'

# ─── Backend services for exambridge.uz ─────────────────────────────────────
# Domain: nodir.exambridge.uz (proxied by sat_front nginx)
# Network: joins shared exambridge_net (created by sat_front compose)
#
# Start order:
#   1. First run sat_front (creates exambridge_net + owns 80/443)
#   2. Then run this (docker-compose up -d --build)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    # max_connections: gunicorn endi ko'p oqimli (workers × threads), har bir oqim
    # o'ziga ulanish oladi. Standart 100 yetmaydi — 300 ga oshirildi.
    command: >
      postgres
      -c max_connections=${DB_MAX_CONNECTIONS:-300}
      -c shared_buffers=${DB_SHARED_BUFFERS:-256MB}
    volumes:
      - postgres_data:/var/lib/postgresql/data   # ← data NEVER deleted on restart
    environment:
      POSTGRES_DB: ${DB_NAME:-satdb}
      POSTGRES_USER: ${DB_USER:-satuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - exambridge_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-satuser} -d ${DB_NAME:-satdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 256mb juda kam edi — cache to'lganda Redis eski kalitlarni o'chirib
    # tashlardi. Sessiyalar endi `cached_db` (settings.py) — Redis o'chirsa ham
    # DB dan tiklanadi, ya'ni user logout bo'lib qolmaydi.
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-1gb} --maxmemory-policy allkeys-lru
    networks:
      - exambridge_net

  # ── Django / Gunicorn ────────────────────────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - exambridge_net
    # Internal only — no host port binding, nginx (in sat_front) handles routing

  # ── Celery Worker ────────────────────────────────────────────────────────────
  celery:
    build: .
    restart: unless-stopped
    # Writing AI baholash shu yerda ishlaydi (evaluate_writing.delay).
    # 2 ta juda kam edi — bir vaqtda 2 tadan ko'p essay yuborilsa navbat yig'ilardi.
    command: celery -A config worker -l info --concurrency ${CELERY_CONCURRENCY:-6}
    volumes:
      - media_volume:/app/media
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - exambridge_net

  # ── Celery Beat (jadval bo'yicha ishlaydigan vazifalar) ─────────────────────
  # Har kuni 04:00 da eski speaking ovoz yozuvlarini o'chiradi.
  # Bu ALOHIDA jarayon — worker o'zi jadvalni bajarmaydi, shuning uchun
  # bu konteynersiz avtomatik tozalash umuman ishlamaydi.
  # Diqqat: faqat BITTA nusxada ishlashi kerak (aks holda vazifa takrorlanadi).
  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - exambridge_net

# ─── Shared external network (owned by sat_front compose) ────────────────────
networks:
  exambridge_net:
    external: true

# ─── Persistent volumes (survive restarts & re-deploys) ──────────────────────
volumes:
  postgres_data:      # PostgreSQL data — NEVER wiped automatically
  static_volume:      # Django collectstatic output
  media_volume:       # User-uploaded files
